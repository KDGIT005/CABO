# Cabo Backend Properties

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/cabo
spring.datasource.username=root
spring.datasource.password=kuldeep005
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Firebase
cabo.firebase.project-id=${FIREBASE_PROJECT_ID:cabo-app-fc722}
cabo.admin.email=${CABO_ADMIN_EMAIL:kuldeepdhangad@gmail.com}

# CORS
cabo.cors.allowed-origins=${CABO_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# File upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# H2 Console (Disabled by default in production)
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

