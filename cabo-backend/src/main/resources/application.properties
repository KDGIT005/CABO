# Cabo Backend Properties

server.port=8080

# H2 Database (Development)
spring.datasource.url=jdbc:h2:file:./cabo-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Firebase
cabo.firebase.project-id=cabo-app-fc722
cabo.admin.email=kuldeepdhangad@gmail.com

# CORS
cabo.cors.allowed-origins=${CABO_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# File upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
